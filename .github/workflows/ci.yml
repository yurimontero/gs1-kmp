# Compiles every target and runs the tests on each push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: JVM, Android, JS, Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Compiles all modules (sample included), runs JVM, JS and Wasm tests and checks the public API dump
      - run: ./gradlew build

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: "**/build/reports/tests/"

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native compiler and dependencies
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Tests on the Apple Silicon simulator and a device build
      - run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: "**/build/reports/tests/"
