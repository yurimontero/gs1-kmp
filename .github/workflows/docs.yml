# Builds the documentation site (Zensical guides + Dokka API reference) and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: API reference (Dokka)
        run: ./gradlew :dokkaGeneratePublicationHtml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Guides (Zensical)
        run: |
          pip install zensical==0.0.72
          zensical build

      - name: Put the API reference under /api
        run: cp -r build/dokka/html site/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
