# Coordinates shared by every module (io.github.yurimontero:<module>:<version>)
group=io.github.yurimontero
version=0.2.0-SNAPSHOT

# Maven Central (com.vanniktech.maven.publish). Module name and description: <module>/gradle.properties.
# Credentials and signing key: ~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_* variables, never here.
mavenCentralPublishing=true
signAllPublications=true
POM_INCEPTION_YEAR=2026
POM_URL=https://yurimontero.github.io/gs1-kmp/
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/yurimontero/gs1-kmp
POM_SCM_CONNECTION=scm:git:https://github.com/yurimontero/gs1-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/yurimontero/gs1-kmp.git
POM_DEVELOPER_ID=yurimontero
POM_DEVELOPER_NAME=Yuri Montero
POM_DEVELOPER_URL=https://github.com/yurimontero

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
android.sync.suppressAgpWarnings=GENERIC

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
